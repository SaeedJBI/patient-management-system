{% extends "admin/login.html" %}
{% load i18n static %}

{% block extrastyle %}
{{ block.super }}
<style>
    html, body {
        height: 100%;
        margin: 0;
        font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    }

    /* Gradient background with soft radial accents and fallback */
    body.login {
        background-color: #FCE4F1; /* fallback for older browsers */
        background: linear-gradient(135deg, #FCE4F1 0%, #E0F4FF 100%);
        min-height: 100vh; /* fixed for Edge/Safari */
        display: -ms-flexbox;
        display: flex;
        -ms-flex-align: center;
        align-items: center;
        -ms-flex-pack: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
    }

    /* Subtle decorative radial shapes to fill whitespace */
    body.login::before {
        content: "";
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background:
            radial-gradient(circle at 20% 15%, rgba(255, 192, 203, 0.2), transparent 35%),
            radial-gradient(circle at 80% 85%, rgba(0, 173, 239, 0.15), transparent 40%);
        z-index: 0;
        pointer-events: none;
    }

    /* Frosted-glass container */
    #container {
        position: relative;
        z-index: 1;
        background-color: rgba(255, 255, 255, 0.9); /* fallback for Edge */
        background: rgba(255, 255, 255, 0.22);
        backdrop-filter: blur(22px);
        -webkit-backdrop-filter: blur(22px);
        border-radius: 20px;
        padding: 45px 30px 30px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.28);
        border: 1px solid rgba(255, 255, 255, 0.3);
        width: 92%;
        max-width: 380px;
        text-align: center;
        margin: 20px auto;
    }

    /* Logo at top */
    .login-logo {
        display: block;
        margin: 0 auto 25px auto;
        width: 100px;
        height: auto;
        object-fit: contain;
        border-radius: 8px;
    }

    /* Form layout */
    #login-form label {
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
        text-align: left;
        color: #333333;
        letter-spacing: 0.3px;
    }

#login-form input[type="text"],
#login-form input[type="password"] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.85);
    border: 1px solid rgba(200, 200, 200, 0.6); /* explicit border for Edge/old browsers */
    outline: none;
    -webkit-appearance: none; /* cross-browser */
    appearance: none;         /* cross-browser */
    margin-bottom: 15px;
    transition: box-shadow 0.2s ease, transform 0.1s ease;
}

#login-form input[type="text"]:focus,
#login-form input[type="password"]:focus {
    border-color: #00ADEF; /* subtle focus border */
    box-shadow: 0 0 0 3px rgba(0, 173, 239, 0.25);
    transform: translateY(-1px);
}

    /* Submit button */
    .submit-row input[type="submit"] {
        background: #00ADEF;
        color: white;
        padding: 13px 20px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        width: 100%;
        font-weight: 600;
        letter-spacing: 0.4px;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .submit-row input[type="submit"]:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 18px rgba(0, 173, 239, 0.35);
        background: #0096D6;
    }

    .errornote {
        background-color: rgba(255, 0, 0, 0.18);
        color: #ffe5e5;
        border-radius: 6px;
        padding: 10px;
        margin-bottom: 15px;
        font-size: 0.9rem;
    }

    .password-reset-link {
        text-align: center;
        margin-top: 18px;
        font-size: 0.85rem;
        color: #555555;
    }
</style>
{% endblock %}

{% block content %}
<div id="content-main">
    <form action="{{ app_path }}" method="post" id="login-form">
        {% csrf_token %}
        <div class="form-row">
            <label for="id_username">{% trans 'Username:' %}</label>
            <input type="text" name="username" id="id_username" class="form-control" required autofocus>
        </div>
        <div class="form-row">
            <label for="id_password">{% trans 'Password:' %}</label>
            <input type="password" name="password" id="id_password" class="form-control" required>
        </div>
        <input type="hidden" name="next" value="{{ next }}">
        <div class="submit-row">
            <input type="submit" value="{% trans 'Log in' %}">
        </div>
    </form>

    <script>
    document.getElementById('login-form').addEventListener('submit', function(e) {
        sessionStorage.setItem('admin_login', 'true');
    });
    </script>
</div>
{% endblock %}
