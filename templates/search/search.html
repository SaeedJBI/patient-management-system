{% extends "admin/base_site.html" %}
{% load i18n static %}

{% block extrastyle %}
{{ block.super }}
<style>
    .search-container {
        max-width: 1200px;
        margin: 20px auto;
        padding: 20px;
    }
    .search-box {
        margin-bottom: 20px;
    }
    .search-input {
        width: 100%;
        padding: 12px;
        font-size: 16px;
        border: 2px solid #ddd;
        border-radius: 5px;
    }
    .search-input:focus {
        border-color: #79aec8;
        outline: none;
    }
    .results-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
    }
    .results-table th {
        background: #f8f8f8;
        padding: 10px;
        text-align: left;
        border-bottom: 2px solid #ddd;
    }
    .results-table td {
        padding: 10px;
        border-bottom: 1px solid #eee;
    }
    .results-table tr:hover {
        background: #f5f5f5;
    }
    .pagination {
        margin-top: 20px;
        text-align: center;
    }
    .pagination a, .pagination span {
        display: inline-block;
        padding: 5px 10px;
        margin: 0 2px;
        border: 1px solid #ddd;
        border-radius: 3px;
        text-decoration: none;
    }
    .pagination .current {
        background: #79aec8;
        color: white;
        border-color: #79aec8;
    }
    .filter-panel {
        background: #f8f8f8;
        padding: 15px;
        margin-bottom: 20px;
        border-radius: 5px;
    }
    .filter-row {
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
    }
    .filter-group {
        flex: 1;
        min-width: 150px;
    }
    .filter-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
    }
    .filter-group select, .filter-group input {
        width: 100%;
        padding: 8px;
        border: 1px solid #ddd;
        border-radius: 3px;
    }
    .search-stats {
        margin: 10px 0;
        color: #666;
    }
    .loading {
        text-align: center;
        padding: 40px;
        color: #666;
    }
    .no-results {
        text-align: center;
        padding: 40px;
        color: #666;
        background: #f8f8f8;
        border-radius: 5px;
    }
</style>
{% endblock %}

{% block content %}
<div class="search-container">
    <h1>{% trans "Patient Search" %}</h1>
    
    <div class="search-box">
        <input type="text" 
               id="search-input" 
               class="search-input" 
               placeholder="{% trans 'Search by name, MRN, national ID, or phone...' %}"
               autofocus>
    </div>
    
    <div class="filter-panel">
        <h3>{% trans "Filters" %}</h3>
        <div class="filter-row">
            <div class="filter-group">
                <label for="branch-filter">{% trans "Branch" %}</label>
                <select id="branch-filter">
                    <option value="">{% trans "All Branches" %}</option>
                    <!-- Will be populated via JavaScript -->
                </select>
            </div>
            <div class="filter-group">
                <label for="gender-filter">{% trans "Gender" %}</label>
                <select id="gender-filter">
                    <option value="">{% trans "All" %}</option>
                    <option value="M">{% trans "Male" %}</option>
                    <option value="F">{% trans "Female" %}</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="age-min">{% trans "Min Age" %}</label>
                <input type="number" id="age-min" min="0" max="150">
            </div>
            <div class="filter-group">
                <label for="age-max">{% trans "Max Age" %}</label>
                <input type="number" id="age-max" min="0" max="150">
            </div>
        </div>
    </div>
    
    <div id="search-stats" class="search-stats"></div>
    <div id="results-container"></div>
    <div id="pagination" class="pagination"></div>
</div>

<script>
let currentPage = 1;
let currentQuery = '';
let currentFilters = {};

function getFilters() {
    return {
        branch: document.getElementById('branch-filter').value,
        gender: document.getElementById('gender-filter').value,
        age_min: document.getElementById('age-min').value,
        age_max: document.getElementById('age-max').value,
    };
}

function performSearch(page = 1) {
    const query = document.getElementById('search-input').value;
    const filters = getFilters();
    
    if (query.length < 2) {
        document.getElementById('results-container').innerHTML = 
            '<div class="no-results">{% trans "Type at least 2 characters to search" %}</div>';
        return;
    }
    
    currentQuery = query;
    currentFilters = filters;
    currentPage = page;
    
    // Build URL with filters
    let url = `/{{ LANGUAGE_CODE }}/search/api/?q=${encodeURIComponent(query)}&page=${page}`;
    if (filters.branch) url += `&branch=${filters.branch}`;
    if (filters.gender) url += `&gender=${filters.gender}`;
    if (filters.age_min) url += `&age_min=${filters.age_min}`;
    if (filters.age_max) url += `&age_max=${filters.age_max}`;
    
    document.getElementById('results-container').innerHTML = 
        '<div class="loading">{% trans "Searching..." %}</div>';
    
    fetch(url)
        .then(response => response.json())
        .then(data => {
            displayResults(data);
            updatePagination(data);
        })
        .catch(error => {
            document.getElementById('results-container').innerHTML = 
                '<div class="no-results">{% trans "An error occurred. Please try again." %}</div>';
        });
}

function displayResults(data) {
    const container = document.getElementById('results-container');
    const stats = document.getElementById('search-stats');
    
    if (data.total === 0) {
        container.innerHTML = '<div class="no-results">{% trans "No patients found." %}</div>';
        stats.innerHTML = '';
        return;
    }
    
    stats.innerHTML = `{% trans "Found" %} ${data.total} {% trans "patients" %}`;
    
    let html = '<table class="results-table">';
    html += '<thead><tr><th>{% trans "MRN" %}</th><th>{% trans "Name" %}</th><th>{% trans "National ID" %}</th><th>{% trans "Gender" %}</th><th>{% trans "Age" %}</th><th>{% trans "Phone" %}</th><th>{% trans "Branch" %}</th></tr></thead><tbody>';
    
    data.results.forEach(patient => {
        html += `<tr>
            <td><a href="/{{ LANGUAGE_CODE }}/admin/patients/patient/${patient.id}/change/">${patient.mrn}</a></td>
            <td>${patient.name}</td>
            <td>${patient.national_id}</td>
            <td>${patient.gender}</td>
            <td>${patient.age}</td>
            <td>${patient.phone}</td>
            <td>${patient.branch}</td>
        </tr>`;
    });
    
    html += '</tbody></table>';
    container.innerHTML = html;
}

function updatePagination(data) {
    const pagination = document.getElementById('pagination');
    const totalPages = Math.ceil(data.total / data.page_size);
    
    if (totalPages <= 1) {
        pagination.innerHTML = '';
        return;
    }
    
    let html = '';
    
    if (data.page > 1) {
        html += `<a href="#" onclick="performSearch(${data.page - 1}); return false;">&laquo; {% trans "Previous" %}</a>`;
    }
    
    for (let i = 1; i <= totalPages; i++) {
        if (i === data.page) {
            html += `<span class="current">${i}</span>`;
        } else {
            html += `<a href="#" onclick="performSearch(${i}); return false;">${i}</a>`;
        }
    }
    
    if (data.page < totalPages) {
        html += `<a href="#" onclick="performSearch(${data.page + 1}); return false;">{% trans "Next" %} &raquo;</a>`;
    }
    
    pagination.innerHTML = html;
}

// Search as user types (with debounce)
let searchTimeout;
document.getElementById('search-input').addEventListener('input', function() {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => performSearch(1), 300);
});

// Apply filters when changed
document.querySelectorAll('.filter-panel select, .filter-panel input').forEach(element => {
    element.addEventListener('change', () => performSearch(1));
});

// Load branches on page load
fetch('/{{ LANGUAGE_CODE }}/branches/api/')
    .then(response => response.json())
    .then(branches => {
        const select = document.getElementById('branch-filter');
        branches.forEach(branch => {
            const option = document.createElement('option');
            option.value = branch.id;
            option.textContent = `${branch.name} (${branch.code})`;
            select.appendChild(option);
        });
    });
</script>
{% endblock %}
